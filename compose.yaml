services:
  sentinel:
    image: sentinelzone-ai:standalone-20260924
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:18080:8000"
    environment:
      SENTINEL_MODE: production
      SENTINEL_DEVICE: cpu
      SENTINEL_CPU_THREADS: "2"
      OMP_NUM_THREADS: "2"
      SENTINEL_SETUP_FILE: /opt/sentinelzone/data/setup/camera.json
    volumes:
      - sentinel-data:/opt/sentinelzone/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  sentinel-data:
