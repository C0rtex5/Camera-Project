# One instance per host, from any checkout.
#
# The project name below is pinned so that `docker compose up -d` run from a
# different directory, a second clone, or with a different project name still
# addresses the SAME stack. Before this was pinned, the project name came from
# the checkout directory, so two checkouts produced two stacks with two
# containers, two volumes and two hosts of port 8000 — each with
# `restart: unless-stopped`, so they took turns owning the port and the
# deployment looked like it was flapping. See deploy/SINGLE_INSTANCE.md.
name: sentinelzone

services:
  sentinel:
    # A fixed container name makes a second instance fail loudly at create time
    # ("container name /sentinelzone is already in use") instead of quietly
    # starting a duplicate that fights over the host port.
    container_name: sentinelzone
    build: .
    image: sentinelzone-ai:production
    restart: unless-stopped
    init: true
    ports:
      - "0.0.0.0:1221:8000"
    # Optional deployment overrides: docker compose --env-file .env.production -f compose.yaml up -d
    environment:
      SENTINEL_MODE: production
      SENTINEL_CAMERA_CONFIG: ${SENTINEL_CAMERA_CONFIG:-}
      SENTINEL_SETUP_FILE: /opt/sentinelzone/data/setup/camera.json
      SENTINEL_DETECTOR_WEIGHTS: /models/detector.pt
      SENTINEL_GNN_CHECKPOINT: /models/forecast.pt
      SENTINEL_DEVICE: ${SENTINEL_DEVICE:-auto}
      SENTINEL_CPU_THREADS: "2"
      OMP_NUM_THREADS: "2"
      CAMERA_GATE_RTSP: ${CAMERA_GATE_RTSP:-}
    volumes:
      - ./weights:/models:ro
      - sentinel-data:/opt/sentinelzone/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  sentinel-data:
    # Explicit volume name so the persisted camera setup, surveys and manifests
    # keep one identity even if the checkout directory is renamed or moved.
    name: sentinelzone-state
